<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d34">
<title>Répétition coranique</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --card:#fffdf8; --ink:#1d2a27; --muted:#6b7a75;
    --accent:#0f3d34; --accent2:#1f6b5a; --gold:#b8892e; --line:#e6dfd0;
    --hl:#fff4d6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1614; --card:#15201d; --ink:#e9efe9; --muted:#93a39d;
      --accent:#5cc2a6; --accent2:#3e9c84; --gold:#d9b25c; --line:#26332f; --hl:#2a2a17; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
  header{background:var(--accent);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  @media (prefers-color-scheme: dark){ header{background:#0b2b25} }
  header h1{font-size:18px;margin:0;font-weight:600}
  header .ar{font-family:"Amiri Quran",serif;font-size:22px;margin-left:auto;opacity:.9}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  select,input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .full{grid-column:1/-1}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500;margin:0}
  button{font:inherit;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600}
  .primary{background:var(--accent2);color:#fff;flex:1;min-width:140px;font-size:16px}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);margin-top:12px}
  .status b{color:var(--ink)}
  .badge{display:inline-block;background:var(--hl);color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
  .msg{font-size:13px;color:#b04a3a;margin-top:8px;min-height:1em}
  .ayah{padding:14px 12px;border-bottom:1px solid var(--line);border-radius:10px;transition:background .25s;cursor:pointer}
  .ayah:last-child{border-bottom:0}
  .ayah.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--gold)}
  .ayah .t{font-family:"Amiri Quran",serif;font-size:28px;line-height:2.1;direction:rtl;text-align:right}
  .ayah .n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border:1.5px solid var(--gold);border-radius:50%;font-size:13px;font-family:Inter,sans-serif;color:var(--gold);margin-inline:6px;vertical-align:middle}
  .ayah .fr{font-size:14px;color:var(--muted);line-height:1.55;margin-top:4px}
  .bism{font-family:"Amiri Quran",serif;font-size:26px;text-align:center;direction:rtl;padding:6px 0 10px;color:var(--accent)}
  .hint{font-size:12px;color:var(--muted)}
  input[type=range]{width:100%}
  .focus{position:sticky;top:58px;z-index:4;border-color:var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .focus[hidden]{display:none}
  .fref{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
  .far{font-family:"Amiri Quran",serif;font-size:32px;line-height:2.1;direction:rtl;text-align:right;max-height:38vh;overflow:auto}
  .far .n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border:1.5px solid var(--gold);border-radius:50%;font-size:13px;font-family:Inter,sans-serif;color:var(--gold);margin-inline:6px;vertical-align:middle}
  .ffr{font-size:14px;color:var(--muted);line-height:1.5}
  .track{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--gold);transition:width .25s linear}
</style>
</head>
<body>
<header>
  <h1>Répétition coranique</h1>
  <span class="ar">القرآن الكريم</span>
</header>

<main>
  <section class="card">
    <div class="grid">
      <div class="full">
        <label for="surah">Sourate</label>
        <select id="surah"></select>
      </div>
      <div>
        <label for="from">Du verset</label>
        <input id="from" type="number" min="1" value="1">
      </div>
      <div>
        <label for="to">Au verset</label>
        <input id="to" type="number" min="1" value="5">
      </div>
      <div>
        <label for="reciter">Récitateur</label>
        <select id="reciter"></select>
      </div>
      <div>
        <label for="loops">Répéter la plage</label>
        <select id="loops">
          <option value="0">∞ En continu</option>
          <option value="3">3 fois</option>
          <option value="5">5 fois</option>
          <option value="7">7 fois</option>
          <option value="10">10 fois</option>
          <option value="20">20 fois</option>
          <option value="40">40 fois</option>
        </select>
      </div>
      <div>
        <label for="each">Chaque verset</label>
        <select id="each">
          <option value="1">1 fois</option>
          <option value="2">2 fois</option>
          <option value="3">3 fois</option>
          <option value="5">5 fois</option>
          <option value="10">10 fois</option>
        </select>
      </div>
      <div>
        <label for="gap">Pause entre boucles</label>
        <select id="gap">
          <option value="0">Aucune</option>
          <option value="1">1 s</option>
          <option value="2">2 s</option>
          <option value="3">3 s</option>
          <option value="5">5 s</option>
          <option value="10">10 s</option>
        </select>
      </div>
      <div>
        <label for="speed">Vitesse : <span id="speedVal">1.00×</span></label>
        <input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="1">
      </div>
      <div class="full row" style="gap:18px">
        <label class="chk">Traduction
          <select id="trans" style="width:auto;padding:6px 10px">
            <option value="fr">Français (Hamidullah)</option>
            <option value="en">English (Saheeh International)</option>
            <option value="none">Aucune</option>
          </select>
        </label>
        <label class="chk"><input type="checkbox" id="bismOn"> Basmala au début de chaque boucle</label>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="primary" id="play">▶ Lancer la répétition</button>
      <button class="ghost" id="prev" title="Verset précédent">⏮</button>
      <button class="ghost" id="next" title="Verset suivant">⏭</button>
      <button class="ghost" id="stop" title="Arrêter">■</button>
    </div>

    <div class="status">
      <span>En cours : <b id="cur">—</b></span>
      <span>Boucle <span class="badge" id="loopCount">0</span></span>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint">Ton réglage est mémorisé : en rouvrant l'application, tu retrouves la même plage, prête à rejouer.</div>
  </section>

  <section class="card" id="offCard">
    <div class="row" style="justify-content:space-between">
      <b>Hors ligne</b>
      <span class="badge" id="offState">—</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="dlRange">⬇ Télécharger la plage</button>
      <button class="ghost" id="dlSurah">⬇ Toute la sourate</button>
      <button class="ghost" id="dlClear">🗑 Tout supprimer</button>
    </div>
    <div class="track" id="dlTrack" hidden><div class="bar" id="dlBar"></div></div>
    <div class="hint" id="offInfo" style="margin-top:8px"></div>
  </section>

  <section class="card focus" id="focus" hidden>
    <div class="fref" id="fRef"></div>
    <div class="far" id="fAr"></div>
    <div class="ffr" id="fFr"></div>
    <div class="track"><div class="bar" id="bar"></div></div>
  </section>

  <section class="card" id="verses">
    <div class="hint">Chargement…</div>
  </section>
</main>

<audio id="audio" preload="auto"></audio>

<script>
(() => {
  "use strict";

  // ---------- Données de base ----------
  const AYAH_COUNTS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
  const NAMES = ["Al-Fatiha","Al-Baqara","Al-Imran","An-Nisa","Al-Maida","Al-Anam","Al-Araf","Al-Anfal","At-Tawba","Yunus","Hud","Yusuf","Ar-Rad","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Muminun","An-Nur","Al-Furqan","Ash-Shuara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajda","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiya","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqia","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahana","As-Saff","Al-Jumua","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqa","Al-Maarij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyama","Al-Insan","Al-Mursalat","An-Naba","An-Naziat","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-Ala","Al-Ghashiya","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyina","Az-Zalzala","Al-Adiyat","Al-Qaria","At-Takathur","Al-Asr","Al-Humaza","Al-Fil","Quraysh","Al-Maun","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
  // Numéro global du 1er verset de chaque sourate (pour l'audio verset par verset)
  const START = []; { let s = 1; for (const c of AYAH_COUNTS){ START.push(s); s += c; } }

  // Chaque récitateur : [id, nom, dossier everyayah.com, édition islamic.network + débits]
  const RECITERS = [
    ["matroud","Abdullah Al-Matroud","Abdullah_Matroud_128kbps", null],
    ["alafasy","Mishary Rashid Alafasy","Alafasy_128kbps", ["ar.alafasy",[128,64]]],
    ["husary","Mahmoud Khalil Al-Husary","Husary_128kbps", ["ar.husary",[128,64]]],
    ["minshawi","Mohamed Siddiq Al-Minshawi","Minshawy_Murattal_128kbps", ["ar.minshawi",[128]]],
    ["abdulbasit","Abdul Basit (Murattal)","Abdul_Basit_Murattal_192kbps", ["ar.abdulbasitmurattal",[192,64]]],
    ["sudais","Abdurrahmaan As-Sudais","Abdurrahmaan_As-Sudais_192kbps", ["ar.abdurrahmaansudais",[192,64]]],
    ["maher","Maher Al-Muaiqly","MaherAlMuaiqly128kbps", ["ar.mahermuaiqly",[128,64]]],
    ["hudhaify","Ali Al-Hudhaify","Hudhaify_128kbps", ["ar.hudhaify",[128,64]]],
    ["ayyoub","Muhammad Ayyoub","Muhammad_Ayyoub_128kbps", ["ar.muhammadayyoub",[128]]],
    ["shuraym","Saood Ash-Shuraym","Saood_ash-Shuraym_128kbps", ["ar.saoodshuraym",[64]]]
  ];
  const pad3 = x => String(x).padStart(3,"0");
  // Liste des URL possibles pour un verset (essayées dans l'ordre si l'une échoue)
  function audioSources(recId, item){
    const r = RECITERS.find(x => x[0] === recId) || RECITERS[0];
    const list = [`https://everyayah.com/data/${r[2]}/${pad3(item.s)}${pad3(item.v)}.mp3`];
    if (r[3]) for (const br of r[3][1]) list.push(`https://cdn.islamic.network/quran/audio/${br}/${r[3][0]}/${item.global}.mp3`);
    return list;
  }
  const BASMALA = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

  // ---------- Éléments ----------
  const $ = id => document.getElementById(id);
  const el = { surah:$("surah"), from:$("from"), to:$("to"), reciter:$("reciter"), loops:$("loops"),
    each:$("each"), gap:$("gap"), speed:$("speed"), speedVal:$("speedVal"), trans:$("trans"),
    bismOn:$("bismOn"), play:$("play"), stop:$("stop"), prev:$("prev"), next:$("next"),
    cur:$("cur"), loopCount:$("loopCount"), msg:$("msg"), verses:$("verses"), audio:$("audio") };

  NAMES.forEach((n,i) => el.surah.add(new Option(`${i+1}. ${n} (${AYAH_COUNTS[i]} versets)`, i+1)));
  RECITERS.forEach(([id,name]) => el.reciter.add(new Option(name, id)));
  el.focus = $("focus"); el.fAr = $("fAr"); el.fFr = $("fFr"); el.fRef = $("fRef"); el.bar = $("bar"); el.offState = $("offState"); el.offInfo = $("offInfo");

  // ---------- Mémorisation ----------
  const KEY = "quran-repeat-settings-v1";
  const FIELDS = ["surah","from","to","reciter","loops","each","gap","speed","trans"];
  function save(){
    const s = {}; FIELDS.forEach(f => s[f] = el[f].value);
    s.bismOn = el.bismOn.checked;
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){}
  }
  function load(){
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (!s) return;
      FIELDS.forEach(f => { if (s[f] != null) el[f].value = s[f]; });
      if (!el.reciter.value) el.reciter.value = "matroud";
      if (!s.trans && s.showFr === false) el.trans.value = "none";
      if (!el.trans.value) el.trans.value = "fr";
      el.bismOn.checked = !!s.bismOn;
    } catch(e){}
  }

  // ---------- Texte des versets ----------
  const cache = {};
  const transOf = a => el.trans.value === "none" ? "" : (a[el.trans.value] || "");
  // Texte : internet d'abord (et on en garde une copie), sinon la copie gardée dans l'application
  const TEXT_CACHE = "quran-text-v1";
  const textUrls = n => [
    `https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,fr.hamidullah,en.sahih`,
    `https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,fr.hamidullah`,
    `https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${n}`
  ];
  async function fetchKeep(u){
    const hasCache = "caches" in window && window.isSecureContext;
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (hasCache) try { await (await caches.open(TEXT_CACHE)).put(u, r.clone()); } catch(e){}
      return r;
    } catch(e){
      if (hasCache){ const c = await (await caches.open(TEXT_CACHE)).match(u); if (c) return c; }
      throw e;
    }
  }
  async function fetchSurah(n){
    if (cache[n]) return cache[n];
    let ayahs;
    try {
      // Arabe + français + anglais en une seule fois (les deux traductions restent disponibles hors ligne)
      let r;
      try { r = await fetchKeep(textUrls(n)[0]); } catch(e){ r = await fetchKeep(textUrls(n)[1]); }
      const [ar, fr, en] = (await r.json()).data;
      const tr = (ed, i) => ed && ed.ayahs[i] ? ed.ayahs[i].text : "";
      ayahs = ar.ayahs.map((a,i) => {
        let t = a.text;
        if (n !== 1 && i === 0 && t.startsWith(BASMALA)) t = t.slice(BASMALA.length).trim();
        return { n: a.numberInSurah, ar: t, fr: tr(fr,i), en: tr(en,i) };
      });
    } catch(e){
      // Source de secours (texte arabe seul)
      const r = await fetchKeep(textUrls(n)[2]);
      const j = await r.json();
      ayahs = j.verses.map(v => ({ n: +v.verse_key.split(":")[1], ar: v.text_uthmani, fr: "" }));
    }
    cache[n] = ayahs; return ayahs;
  }
  // Numéros seuls si le texte ne charge pas, pour que le défilement reste visible
  function placeholderAyahs(n){
    return Array.from({length: AYAH_COUNTS[n-1]}, (_,i) => ({ n:i+1, ar:"", fr:"" }));
  }

  function clampRange(){
    const max = AYAH_COUNTS[+el.surah.value - 1];
    el.from.max = el.to.max = max;
    let a = parseInt(el.from.value,10) || 1, b = parseInt(el.to.value,10) || a;
    a = Math.min(Math.max(1,a), max); b = Math.min(Math.max(1,b), max);
    if (b < a) b = a;
    el.from.value = a; el.to.value = b;
    return [a,b];
  }

  async function render(){
    const n = +el.surah.value; const [a,b] = clampRange();
    el.verses.innerHTML = '<div class="hint">Chargement…</div>';
    let ayahs, textOk = true;
    try { ayahs = await fetchSurah(n); }
    catch(e){ ayahs = placeholderAyahs(n); textOk = false; }
    {
      if (+el.surah.value !== n) return;
      st.ayahs = ayahs;
      const showBism = n !== 1 && n !== 9 && a === 1;
      let html = showBism ? `<div class="bism">${BASMALA}</div>` : "";
      for (const x of ayahs.slice(a-1, b)){
        html += `<div class="ayah" data-n="${x.n}"><div class="t">${x.ar}<span class="n">${x.n}</span></div>` +
                (transOf(x) ? `<div class="fr"${el.trans.value === "en" ? ' lang="en"' : ""}>${x.n}. ${transOf(x)}</div>` : "") + `</div>`;
      }
      if (!textOk) html = `<div class="hint" style="margin-bottom:8px">${OFFLINE_HINT}</div>` + html;
      el.verses.innerHTML = html;
      el.verses.querySelectorAll(".ayah").forEach(d => d.onclick = () => jumpTo(+d.dataset.n));
      highlight();
      updateOffline();
    }
  }
  const OFFLINE_HINT = "Texte introuvable. Si tu vois cette page dans l’aperçu de Claude, c’est normal : l’aperçu bloque internet. Télécharge le fichier et ouvre-le directement dans ton navigateur.";

  // ---------- Lecture ----------
  const audio = el.audio;
  const st = { playing:false, queue:[], idx:0, loop:0, timer:null, srcIdx:0, ayahs:[], token:0 };

  // ---------- Hors ligne (stockage interne de l'application) ----------
  const AUDIO_CACHE = "quran-audio-v1";
  const OFFLINE_OK = window.isSecureContext && "caches" in window && "serviceWorker" in navigator;
  if (OFFLINE_OK) navigator.serviceWorker.register("sw.js").catch(() => {});

  async function cachedIndex(list){
    if (!OFFLINE_OK) return -1;
    try {
      const c = await caches.open(AUDIO_CACHE);
      for (let i = 0; i < list.length; i++) if (await c.match(list[i])) return i;
    } catch(e){}
    return -1;
  }

  async function saveOne(c, item){
    const list = audioSources(el.reciter.value, item);
    if (await cachedIndex(list) >= 0) return true;
    for (const u of list){
      try {
        let r;
        try { r = await fetch(u, { mode:"cors" }); if (!r.ok) continue; }
        catch(e){ r = await fetch(u, { mode:"no-cors" }); }
        await c.put(u, r);
        return true;
      } catch(e){}
    }
    return false;
  }

  let downloading = false;
  async function download(a, b){
    if (!OFFLINE_OK || downloading) return;
    downloading = true;
    const n = +el.surah.value;
    const items = [];
    if (el.bismOn.checked && n !== 1 && n !== 9) items.push({ s:1, v:1, global:1 });
    for (let v = a; v <= b; v++) items.push({ s:n, v, global: START[n-1] + v - 1 });
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
    // Garde aussi le texte de la sourate dans l'application
    let textSaved = false;
    try { await fetchKeep(textUrls(n)[0]); textSaved = true; } catch(e){}
    if (!textSaved) try { await fetchKeep(textUrls(n)[2]); textSaved = true; } catch(e){}
    const c = await caches.open(AUDIO_CACHE);
    $("dlTrack").hidden = false;
    let fails = 0;
    for (let i = 0; i < items.length; i++){
      if (!(await saveOne(c, items[i]))) fails++;
      $("dlBar").style.width = (100 * (i+1) / items.length) + "%";
      el.offInfo.textContent = `Téléchargement… ${i+1} / ${items.length}`;
    }
    $("dlTrack").hidden = true; downloading = false;
    el.offInfo.textContent = fails
      ? `${fails} verset(s) n’ont pas pu être téléchargés. Vérifie ta connexion ou essaie un autre récitateur.`
      : !textSaved ? "Audio téléchargé, mais le texte n’a pas pu être enregistré. Réessaie avec internet."
      : "Téléchargement terminé : cette plage (son et texte) fonctionne maintenant sans internet.";
    if (textSaved && !st.ayahs.some(a => a.ar)){ delete cache[n]; render(); }
    updateOffline();
  }

  async function updateOffline(){
    if (!OFFLINE_OK){
      el.offState.textContent = "Inactif";
      el.offInfo.textContent = "Le mode hors ligne s’active quand l’application est ouverte depuis son adresse en ligne (GitHub Pages, https://…).";
      ["dlRange","dlSurah","dlClear"].forEach(id => $(id).disabled = true);
      return;
    }
    const n = +el.surah.value; const [a,b] = clampRange();
    let ok = 0;
    for (let v = a; v <= b; v++)
      if (await cachedIndex(audioSources(el.reciter.value, { s:n, v, global: START[n-1] + v - 1 })) >= 0) ok++;
    el.offState.textContent = ok === b - a + 1 ? "✓ Disponible hors ligne" : `${ok} / ${b - a + 1} versets téléchargés`;
    try {
      const e = await navigator.storage.estimate();
      if (!downloading) el.offInfo.textContent = `Espace utilisé par l’application : ${(e.usage/1048576).toFixed(1)} Mo. Les fichiers restent dans l’application, pas dans tes fichiers.`;
    } catch(e){}
  }

  // Construit la file d'une boucle : [basmala?] + chaque verset × N
  function buildQueue(){
    const n = +el.surah.value; const [a,b] = clampRange(); const each = +el.each.value;
    const q = [];
    if (el.bismOn.checked && n !== 1 && n !== 9) q.push({ s:1, v:1, global:1, n:0, label:"Basmala" });
    for (let v = a; v <= b; v++) for (let k = 0; k < each; k++)
      q.push({ s:n, v, global: START[n-1] + v - 1, n: v, label: `${NAMES[n-1]} ${n}:${v}` });
    return q;
  }

  // Met en avant le verset récité : surlignage + défilement + panneau « verset en cours »
  function highlight(){
    const item = st.playing ? st.queue[st.idx] : null;
    el.verses.querySelectorAll(".ayah").forEach(d => {
      const on = item && +d.dataset.n === item.n;
      d.classList.toggle("on", !!on);
      if (on) d.scrollIntoView({ behavior:"smooth", block:"center" });
    });
    if (!item){ el.focus.hidden = true; return; }
    el.focus.hidden = false;
    if (item.n === 0){ el.fAr.textContent = BASMALA; el.fFr.textContent = ""; el.fRef.textContent = "Basmala"; }
    else {
      const a = st.ayahs[item.n - 1] || {};
      el.fAr.innerHTML = (a.ar || "") + `<span class="n">${item.n}</span>`;
      el.fFr.textContent = transOf(a);
      el.fRef.textContent = item.label;
    }
    el.bar.style.width = "0%";
  }
  audio.addEventListener("timeupdate", () => {
    if (audio.duration) el.bar.style.width = (100 * audio.currentTime / audio.duration) + "%";
  });

  async function playCurrent(keepSrc){
    clearTimeout(st.timer);
    const item = st.queue[st.idx]; if (!item) return;
    st.inGap = false;
    const list = audioSources(el.reciter.value, item);
    if (!keepSrc){
      // Si une source est déjà téléchargée, on la prend en priorité
      const tok = ++st.token;
      const i = await cachedIndex(list);
      if (tok !== st.token || !st.playing) return;
      st.srcIdx = i >= 0 ? i : 0;
    }
    audio.src = list[st.srcIdx];
    audio.playbackRate = +el.speed.value;
    el.cur.textContent = item.label;
    el.loopCount.textContent = st.loop + (+el.loops.value ? ` / ${el.loops.value}` : "");
    highlight(); updateMediaSession(item);
    audio.play().then(() => { el.msg.textContent = ""; }).catch(err => {
      if (err && err.name === "NotAllowedError") el.msg.textContent = "Appuie sur ▶ pour autoriser la lecture.";
    });
    preloadNext();
  }

  const pre = new Audio(); pre.preload = "auto";
  function preloadNext(){
    const nxt = st.queue[st.idx + 1] || st.queue[0];
    if (nxt) pre.src = audioSources(el.reciter.value, nxt)[0];
  }

  function advance(){
    st.idx++;
    if (st.idx >= st.queue.length){
      const max = +el.loops.value;
      if (max && st.loop >= max){ stop(); el.msg.textContent = `Terminé : ${max} répétitions effectuées.`; return; }
      st.loop++; st.idx = 0;
      st.queue = buildQueue();
      const gap = +el.gap.value * 1000;
      // Pause jouée comme un vrai son silencieux : la lecture continue même écran éteint
      if (gap){ el.cur.textContent = "Pause…"; st.inGap = true; audio.src = silence(gap/1000); audio.play().catch(()=>{}); return; }
    }
    playCurrent();
  }

  const silCache = {};
  function silence(sec){
    if (silCache[sec]) return silCache[sec];
    const rate = 8000, n = rate * sec, b = new DataView(new ArrayBuffer(44 + n));
    const w = (o, s) => [...s].forEach((c,i) => b.setUint8(o+i, c.charCodeAt(0)));
    w(0,"RIFF"); b.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt ");
    b.setUint32(16,16,true); b.setUint16(20,1,true); b.setUint16(22,1,true);
    b.setUint32(24,rate,true); b.setUint32(28,rate,true); b.setUint16(32,1,true); b.setUint16(34,8,true);
    w(36,"data"); b.setUint32(40,n,true);
    for (let i = 0; i < n; i++) b.setUint8(44+i, 128);
    return silCache[sec] = URL.createObjectURL(new Blob([b], {type:"audio/wav"}));
  }

  // Si le système met la lecture en pause (écran éteint, appel…), le bouton l'indique
  audio.addEventListener("pause", () => { if (st.playing && !audio.ended) el.play.textContent = "▶ Reprendre"; });
  audio.addEventListener("play", () => { if (st.playing) el.play.textContent = "⏸ Pause"; });
  audio.addEventListener("ended", () => {
    if (!st.playing) return;
    if (st.inGap){ st.inGap = false; playCurrent(); return; }
    advance();
  });
  audio.addEventListener("error", () => {
    if (!st.playing) return;
    if (st.inGap){ st.inGap = false; playCurrent(); return; }
    const item = st.queue[st.idx]; if (!item) return;
    if (st.srcIdx + 1 < audioSources(el.reciter.value, item).length){ st.srcIdx++; playCurrent(true); }
    else if (!navigator.onLine){ el.msg.textContent = "Pas d’internet et ce verset n’est pas téléchargé. Utilise « Télécharger la plage » quand tu es connectée."; stop(); }
    else { el.msg.textContent = "Audio inaccessible. Si tu es dans l’aperçu de Claude, télécharge le fichier et ouvre-le dans ton navigateur. Sinon, vérifie ta connexion ou essaie un autre récitateur."; stop(); }
  });

  function start(){
    st.queue = buildQueue(); st.idx = 0; st.loop = 1; st.playing = true;
    el.play.textContent = "⏸ Pause";
    playCurrent();
  }
  function stop(){
    st.playing = false; st.inGap = false; clearTimeout(st.timer); audio.pause();
    el.play.textContent = "▶ Lancer la répétition"; el.cur.textContent = "—";
    highlight();
  }
  function togglePlay(){
    if (!st.playing){ start(); return; }
    if (audio.paused){ audio.play(); el.play.textContent = "⏸ Pause"; }
    else { audio.pause(); el.play.textContent = "▶ Reprendre"; }
  }
  function jumpTo(v){
    if (!st.playing){ st.queue = buildQueue(); st.loop = 1; st.playing = true; el.play.textContent = "⏸ Pause"; }
    const i = st.queue.findIndex(x => x.n === v); if (i >= 0){ st.idx = i; playCurrent(); }
  }
  function step(d){
    if (!st.playing) return;
    st.idx = Math.max(0, Math.min(st.queue.length - 1, st.idx + d)); playCurrent();
  }

  function updateMediaSession(item){
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: item.label, artist: el.reciter.selectedOptions[0].text, album: "Répétition coranique" });
      navigator.mediaSession.setActionHandler("play", () => { audio.play(); el.play.textContent = "⏸ Pause"; });
      navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); el.play.textContent = "▶ Reprendre"; });
      navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
      navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
    } catch(e){}
  }

  // ---------- Événements ----------
  el.play.onclick = togglePlay;
  el.stop.onclick = stop;
  el.prev.onclick = () => step(-1);
  el.next.onclick = () => step(1);

  // Changer la plage/sourate/récitateur : la boucle repart avec le nouveau réglage
  const restartIfPlaying = () => { save(); if (st.playing){ stop(); start(); } };
  el.surah.onchange = () => { el.from.value = 1; el.to.value = Math.min(5, AYAH_COUNTS[+el.surah.value-1]); save(); render(); if (st.playing){ stop(); start(); } };
  [el.from, el.to].forEach(x => x.onchange = () => { clampRange(); save(); render(); if (st.playing){ stop(); start(); } });
  el.reciter.onchange = () => { restartIfPlaying(); updateOffline(); };
  $("dlRange").onclick = () => { const [a,b] = clampRange(); download(a,b); };
  $("dlSurah").onclick = () => download(1, AYAH_COUNTS[+el.surah.value-1]);
  $("dlClear").onclick = async () => {
    const b = $("dlClear");
    if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = "Confirmer la suppression ?"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "🗑 Tout supprimer"; }, 4000); return; }
    b.dataset.confirm = ""; b.textContent = "🗑 Tout supprimer";
    try { await caches.delete(AUDIO_CACHE); } catch(e){}
    el.offInfo.textContent = "Téléchargements supprimés."; updateOffline();
  };
  [el.loops, el.each, el.gap, el.bismOn].forEach(x => x.onchange = save);
  el.trans.onchange = () => { save(); render(); };
  el.speed.oninput = () => { el.speedVal.textContent = (+el.speed.value).toFixed(2) + "×"; audio.playbackRate = +el.speed.value; save(); };

  window.addEventListener("online", () => {
    if (!st.ayahs.some(a => a.ar)){ delete cache[+el.surah.value]; render(); }
  });

  // ---------- Démarrage ----------
  load();
  el.speedVal.textContent = (+el.speed.value).toFixed(2) + "×";
  render();
})();
</script>
</body>
</html>
